title: Minamo
description: >-
  Su icme takibi icin bir Android uygulamasi. Hesap yok, reklam yok,
  internet izni yok.

# baseurl bos birakilamaz: bos kalirsa sayfa ici baglar hb4sri.github.io
# koklerine gider, minamo-web'e degil.
url: https://hb4sri.github.io
baseurl: /minamo-web

lang: tr

# gizlilik.md, uygulama deposundaki docs/index.md ile birebir ayni kalsin
# diye on bilgi (front matter) tasimaz. Sayfaya ne gerekiyorsa buradan verilir.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Play Console'a tek bir adres verilecegi icin adres uzantisiz sabit.
  - scope:
      path: "gizlilik.md"
    values:
      permalink: /gizlilik/
      aciklama: >-
        Minamo gizlilik politikasi: sunucu yok, hesap yok, internet izni yok.
        Veriler telefonda kalir; Health Connect, yedek dosyasi ve telefon
        degistirme disinda cikmaz.
